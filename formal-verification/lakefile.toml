name = "poseidon2"
version = "0.1.0"
defaultTargets = ["Poseidon2"]

[leanOptions]
autoImplicit = false

# Same Mathlib tag as the EVMLean commit below pins (its lake-manifest resolves
# v4.29.0 to 8a178386ffc0f5fef0b77738bb5449d50efeea95).
[[require]]
name = "mathlib"
git = "https://github.com/leanprover-community/mathlib4.git"
rev = "v4.29.0"

[[lean_lib]]
name = "Poseidon2"

# EVM semantics. Only its Lean modules are built here: its `extern_lib`
# (C sources cloned from GitHub, compiled with `cc`) is linked into
# executables only, and this package builds none.
[[require]]
name = "evmlean"
git = "https://github.com/lefterislazar/EVMLean.git"
rev = "fd4f5e6d6d6b4a18eb73f5a71ae2df909ac2b542"
