[package]
name = "poseidon2-gen"
version = "0.1.0"
edition = "2024"
description = "Rust port of the poseidon2-evm Huff and Yul generators"
license = "MIT"
publish = false

[[bin]]
name = "poseidon2-gen"
path = "src/main.rs"

[dependencies]
clap = { version = "4.6", features = ["derive"] }
rayon = "1.12"
ruint = "1.20"

[profile.release]
debug = false
lto = "thin"
codegen-units = 1

# the tests derive the parameters of t = 28, too slow unoptimized
[profile.dev]
opt-level = 3
