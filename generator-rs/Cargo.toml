[package]
name = "poseidon2-gen"
version = "0.1.0"
edition = "2024"
description = "Rust port of the poseidon2-evm Huff and Yul generators"
license = "MIT"
publish = false

[[bin]]
name = "poseidon2-gen"
path = "src/main.rs"

[dependencies]
clap = { version = "4.6", features = ["derive"] }
rayon = "1.12"
ruint = "1.20"
# compile and run the generated Huff (verify)
huff-neo-core = { git = "https://github.com/zemse/huff-neo", rev = "d4682e4eb6c40b49655e471364d9872df3ce3228" }
huff-neo-utils = { git = "https://github.com/zemse/huff-neo", rev = "d4682e4eb6c40b49655e471364d9872df3ce3228" }
revm = { version = "=43.0.3", default-features = false, features = ["std"] }

[profile.release]
debug = false
lto = "thin"
codegen-units = 1

# the tests derive the parameters of t = 28, too slow unoptimized
[profile.dev]
opt-level = 3
