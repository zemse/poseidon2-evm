name: test

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  generator:
    name: Generator tests
    runs-on: ubuntu-latest
    # the verify tests build and run every width on Amsterdam and Osaka
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Cache cargo
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: generator-rs

      - name: Run generator tests
        run: cargo test --release --locked --manifest-path generator-rs/Cargo.toml

  check:
    strategy:
      fail-fast: true

    name: Foundry project
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          submodules: recursive

      - name: Cache cargo
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: generator-rs

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@908c540300062bd5a7e473851cdb4282204cee09 # v1
        with:
          # the formatter, the trace format gas-report.sh reads and the Amsterdam gas depend on it
          version: v1.8.5

      - name: Install huff-neo
        uses: cakevm/huff-neo-toolchain@65b08ca4fdef76e097484d376b4621ae8cc77b21 # v1
        with:
          version: 1.7.1

      - name: Check formatting
        run: forge fmt --check

      - name: Check generated files are in sync
        run: |
          npm run generate:yul
          npm run generate:huff
          git diff --exit-code || (echo "Generated files are out of sync. Run 'npm run generate:yul && npm run generate:huff' and commit the changes." && exit 1)

      - name: Check the Huff against revm (outputs and the gas model)
        run: npm run verify:huff

      - name: Run Forge build
        run: |
          forge --version
          forge build --sizes
        id: build

      - name: Check the yul libraries compile for consumers in every compiler mode
        run: ./compat-check.sh
        id: compat

      - name: Run the Huff unit tests
        run: hnc src/bn254/huff/Utils.huff test

      - name: Run Forge tests
        run: |
          forge test -vvv
        id: test

      - name: Check the EIP-8024 gate (the huff output fails before Amsterdam)
        run: |
          if out=$(forge test --hardfork osaka --match-path test/Poseidon2T16.t.sol 2>&1); then
            echo "$out"
            echo "the EIP-8024 output ran on Osaka" && exit 1
          fi
          if ! echo "$out" | grep -q "FAIL: permutation call failed" || echo "$out" | grep -q "\[PASS\]"; then
            echo "$out"
            echo "the Osaka run failed, but not only by the permutation call failing" && exit 1
          fi
        id: gate

      - name: Check gas snapshots
        run: |
          cp gas-report gas-report.expected
          ./gas-report.sh
          diff gas-report.expected gas-report
        id: gas
