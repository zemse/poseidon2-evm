name: test

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

jobs:
  check:
    strategy:
      fail-fast: true

    name: Foundry project
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: nightly

      - name: Install Huff
        uses: huff-language/huff-toolchain@v3
        with:
          version: nightly

      - name: Check formatting
        run: forge fmt --check

      - name: Check generated files are in sync
        run: |
          npm run generate:yul
          npm run generate:huff
          npm run generate:huff:amsterdam
          npm run generate:huff:osaka
          npm run generate:huff:paris
          git diff --exit-code || (echo "Generated files are out of sync. Run 'npm run generate:yul && npm run generate:huff && npm run generate:huff:amsterdam && npm run generate:huff:osaka && npm run generate:huff:paris' and commit the changes." && exit 1)

      - name: Run Forge build
        run: |
          forge --version
          forge build --sizes
        id: build

      - name: Check the yul libraries compile for consumers in every compiler mode
        run: ./compat-check.sh
        id: compat

      - name: Run Forge tests
        run: |
          forge test -vvv
        id: test

      - name: Run the Amsterdam (EIP-8024) Forge tests
        run: |
          FOUNDRY_PROFILE=amsterdam forge test -vvv
        id: test-amsterdam

      - name: Run the Osaka (split permutation) and Paris (no PUSH0) Forge tests
        run: |
          FOUNDRY_PROFILE=osaka forge test -vvv
          FOUNDRY_PROFILE=paris forge test -vvv
        id: test-forks

      - name: Check the hardfork gates (the default output fails on Paris, the Amsterdam output on Osaka)
        run: |
          if FOUNDRY_PROFILE=paris forge test --match-path test/Poseidon2T3.t.sol; then
            echo "the PUSH0 output ran on Paris" && exit 1
          fi
          if FOUNDRY_PROFILE=amsterdam forge test --hardfork osaka --match-path test/amsterdam/Poseidon2T16.t.sol; then
            echo "the EIP-8024 output ran on Osaka" && exit 1
          fi
        id: gates

      - name: Check gas snapshots
        run: |
          cp gas-report gas-report.expected
          ./gas-report.sh
          diff gas-report.expected gas-report
        id: gas
